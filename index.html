!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drift Boss Clone</title>
<style>
    body {
        margin: 0;
        background: #222;
        overflow: hidden;
    }
    canvas {
        display: block;
        margin: auto;
        background: #333;
    }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
// Game setup
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Car properties
let car = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 100,
    width: 40,
    height: 80,
    speed: 2,
    driftSpeed: 3,
    drifting: false
};

// Road properties
let road = {
    width: 200,
    centerX: canvas.width / 2,
    driftOffset: 0
};

// Game state
let score = 0;
let gameOver = false;

// Input handling
document.addEventListener('keydown', () => car.drifting = true);
document.addEventListener('keyup', () => car.drifting = false);
document.addEventListener('mousedown', () => car.drifting = true);
document.addEventListener('mouseup', () => car.drifting = false);

// Main game loop
function gameLoop() {
    if (!gameOver) {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    } else {
        drawGameOver();
    }
}

// Update game state
function update() {
    // Move car forward
    car.y -= car.speed;

    // Drift left/right
    if (car.drifting) {
        road.driftOffset += 0.05; // road shifts to simulate drift
        car.x += car.driftSpeed;
    } else {
        road.driftOffset -= 0.05;
        car.x -= car.driftSpeed;
    }

    // Keep car within road boundaries
    let leftBoundary = road.centerX - road.width / 2;
    let rightBoundary = road.centerX + road.width / 2 - car.width;
    if (car.x < leftBoundary || car.x > rightBoundary) {
        gameOver = true;
    }

    // Increase score
    score++;
}

// Draw everything
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw road
    ctx.fillStyle = '#555';
    ctx.fillRect(road.centerX - road.width / 2, 0, road.width, canvas.height);

    // Draw car
    ctx.fillStyle = 'red';
    ctx.fillRect(car.x, car.y, car.width, car.height);

    // Draw score
    ctx.fillStyle = 'white';
    ctx.font = '20px Arial';
    ctx.fillText(`Score: ${score}`, 10, 30);
}

// Draw game over screen
function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'white';
    ctx.font = '30px Arial';
    ctx.fillText('Game Over', canvas.width / 2 - 80, canvas.height / 2);
    ctx.font = '20px Arial';
    ctx.fillText(`Final Score: ${score}`, canvas.width / 2 - 70, canvas.height / 2 + 40);
}

// Start game
gameLoop();
</script>
</body>
</html>
